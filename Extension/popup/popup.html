<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Oye Lector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="card">
    <h1>Oye Lector</h1>

  <div class="controls">
    <button id="playPauseBtn" aria-label="Iniciar lectura. Atajo: barra espaciadora">
      Iniciar lectura (Espacio)
    </button>

    <button id="restartBtn" aria-label="Reiniciar lectura. Atajo: Enter">
      Reiniciar (Enter)
    </button>

    <button id="questionsBtn" aria-label="Cuestionario de comprensión. Atajo: C">
      Cuestionario (C)
    </button>

    <button id="notesBtn" aria-label="Grabar notas. Atajo: Shift">
      Grabar notas (Shift)
    </button>
  </div>

  <p id="status" class="status">Listo para leer esta página.</p>
  <p id="serverStatus" class="server-status" role="status" aria-live="polite">Servidor IA: verificando...</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
